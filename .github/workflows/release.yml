name: Release new version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Type of version bump (patch, minor, major)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required to dispatch publish.yml at the end of this job.
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies
        run: |
          python -m pip install -e .[deploy]
          python -m pip install towncrier

      - name: Get next version number
        run: |
          echo "version=$(python -m includecontents.next_version ${{ inputs.bump }})" >> "$GITHUB_ENV"

      - name: Store release notes
        run: |
          towncrier build --draft --version $version | tail -n +3 > /tmp/changes.txt

      - name: Build full changelog
        run: |
          towncrier build --yes --name "Version" --version $version

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update CHANGES for $version"
          git tag "v$version" --file=/tmp/changes.txt --cleanup=whitespace
          git push --follow-tags

      - name: Generate github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$version" --title "$version" --notes-from-tag --verify-tag

      # The release above is created with GITHUB_TOKEN, and events triggered by
      # GITHUB_TOKEN don't start new workflow runs -- so publish.yml's `release`
      # trigger never fires. workflow_dispatch is documented as an exception, so
      # dispatch it explicitly rather than leaving the publish as a manual step.
      - name: Publish to PyPI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish.yml --ref "v$version"
